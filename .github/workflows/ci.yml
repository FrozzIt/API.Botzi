name: CI

on:
  pull_request:
  push:
    branches:
      - task/1.1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: proxyapi
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: proxyapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxyapi -d proxyapi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:8.2.1-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      CLIENT_CONFIG_PATH: tests/fixtures/clients.compose.yaml
      DATABASE_URL: postgresql+asyncpg://proxyapi@127.0.0.1:5432/proxyapi
      PROVIDER_ACCOUNTS: primary
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_INTEGRATION_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements/dev.txt
          python -m pip install --no-deps --editable .

      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Smoke test clean Docker stack
        run: |
          docker compose up --build --wait
          test "$(curl --fail --silent http://127.0.0.1:8000/health)" = '{"status":"ok"}'
          test "$(docker compose exec -T postgres psql -U proxyapi -d proxyapi -Atc 'select version_num from alembic_version')" = "20260929_0002"

      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes --remove-orphans
