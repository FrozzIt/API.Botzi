# Development/test only. PostgreSQL trust and unauthenticated Redis require
# hardening before production or any externally reachable CRM test.
name: proxyapi

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: proxyapi
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: proxyapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxyapi -d proxyapi"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      CLIENT_CONFIG_PATH: /run/proxyapi/clients.yaml
      DATABASE_URL: postgresql+asyncpg://proxyapi@postgres:5432/proxyapi
      PROVIDER_ACCOUNTS: primary
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./tests/fixtures/clients.compose.yaml:/run/proxyapi/clients.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *backend-environment
    volumes:
      - ./tests/fixtures/clients.compose.yaml:/run/proxyapi/clients.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres-data:
