components:
  securitySchemes:
    clientToken:
      type: apiKey
      in: header
      name: token
  parameters:
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    funnel_id:
      name: funnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    autofunnel_id:
      name: autofunnel_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    contact_id:
      name: contact_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    detail_id:
      name: detail_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    field_id:
      name: field_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    view_id:
      name: view_id
      in: path
      required: true
      schema:
        type: string
        description: Числовой ID или UUID; точный provider-формат зависит от операции.
    custom_id:
      name: custom_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    lead_id:
      name: lead_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    file_id:
      name: file_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    task_id:
      name: task_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    label_id:
      name: label_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  requestBodies:
    GenericJson:
      required: true
      description: Черновой JSON body; точные поля фиксируются после contract-проверки конкретной операции.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    V1:
      description: |
        HTTP 200. После успешной локальной авторизации возвращается ответ
        операции v1; при непройденной локальной авторизации — application 401.
        Envelope и payload конкретного метода остаются черновыми, если не
        подтверждены отдельным DOC/LIVE evidence.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: '#/components/schemas/V1Response'
              - $ref: '#/components/schemas/AuthErrorResponse'
    Deferred:
      description: |
        HTTP 200. До успешной локальной авторизации возвращается application
        401; после неё — зафиксированный deferred-ответ application 501.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/AuthErrorResponse'
              - $ref: '#/components/schemas/DeferredResponse'
  schemas:
    V1Response:
      type: object
      description: Черновой envelope; не подтверждает непроверенную provider-схему.
      required: [status]
      properties:
        status:
          type: string
        data:
          nullable: true
      additionalProperties: true
    AuthErrorResponse:
      type: object
      required: [status, errors]
      properties:
        status:
          type: string
          enum: [error]
        errors:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: integer
                enum: [401]
              message:
                type: string
                enum: ['Authentication failed']
            additionalProperties: false
      additionalProperties: false
    DeferredResponse:
      type: object
      required: [status, errors]
      properties:
        status:
          type: string
          enum: [error]
        errors:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: integer
                enum: [501]
              message:
                type: string
                enum: ['Operation is not available in this release']
            additionalProperties: false
      additionalProperties: false
