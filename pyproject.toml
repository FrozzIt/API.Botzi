[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-api"
version = "0.1.0"
description = "Isolated API proxy service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.15.2",
  "argon2-cffi==25.1.0",
  "asyncpg==0.30.0",
  "cryptography==45.0.4",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "pydantic-settings==2.9.1",
  "PyYAML==6.0.2",
  "redis==6.1.0",
  "SQLAlchemy==2.0.41",
  "uvicorn==0.34.2",
]

[project.scripts]
proxy-api-admin = "proxy_api.admin:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "ruff==0.11.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL and Redis",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
